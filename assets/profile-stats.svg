    <text x="26" y="13" fill="#D8F3FF" font-family="Segoe UI, Arial, sans-serif" font-size="14">Public repos</text>
    <text x="150" y="13" fill="#F8FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2</text>
